{% extends "layout.html" %}
{% load static %}


{% block title %}Order Confirmation | Harvest Castle{% endblock title %}


{% block content %}
<main id="fd-main">
    <!--==============================
    Confirmation intro
    ============================== -->
    <div class="fd-shop-intro">
        <div class="container">
            <nav aria-label="Breadcrumb">
                <ol class="fd-breadcrumb">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Order Confirmation</li>
                </ol>
            </nav>
            <span class="sec-subtitle">Order update</span>
            <h1 class="sec-title">Order Confirmation</h1>
        </div>
    </div>

    <!--==============================
    Confirmation
    ============================== -->
    <!--
      STAGE 6: states render here from the saved order snapshot
      (sessionStorage freshdirect_last_order). The page never trusts URL
      parameters for payment state — see assets/js/fresh-direct.js.
    -->
    <div class="space">
        <div class="container" id="fd-confirm-wrap">
            <noscript>
                <div class="fd-shop-state">
                    <i class="far fa-exclamation-circle" aria-hidden="true"></i>
                    <h2>JavaScript is required</h2>
                    <p>Please enable JavaScript to view your order confirmation.</p>
                    <a href="product.html" class="vs-btn">Return to Shop</a>
                </div>
            </noscript>
            <div id="fd-confirm-state" aria-live="polite"></div>
        </div>
    </div>
    </main>

{% endblock content %}
